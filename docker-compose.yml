version: '3.9'

services:

  app:
    build: .
    container_name: ipwhoam-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"          # if you add TLS via Caddy/nginx
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ipwhoam
      DB_USER: ipwhoam
      DB_PASS: ${DB_PASS:-changeme}
      APP_HOST: ${APP_HOST:-ipwho.am}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html:ro   # mount app read-only

  db:
    image: mariadb:11
    container_name: ipwhoam-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MARIADB_DATABASE: ipwhoam
      MARIADB_USER: ipwhoam
      MARIADB_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
