<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <style>
      @keyframes pulse-a {
        0%,100% { r: 5; opacity: 1; }
        50%      { r: 9; opacity: 0.5; }
      }
      @keyframes pulse-b {
        0%,100% { r: 5; opacity: 1; }
        50%      { r: 9; opacity: 0.5; }
      }
      @keyframes pulse-c {
        0%,100% { r: 5; opacity: 1; }
        50%      { r: 9; opacity: 0.5; }
      }
      @keyframes glow-a {
        0%,100% { r: 5; opacity: 0; }
        50%      { r: 16; opacity: 0.2; }
      }
      @keyframes glow-b {
        0%,100% { r: 5; opacity: 0; }
        50%      { r: 16; opacity: 0.2; }
      }
      @keyframes glow-c {
        0%,100% { r: 5; opacity: 0; }
        50%      { r: 16; opacity: 0.2; }
      }
      .dot-a  { animation: pulse-a 1.8s ease-in-out infinite; }
      .dot-b  { animation: pulse-b 1.8s ease-in-out infinite 0.6s; }
      .dot-c  { animation: pulse-c 1.8s ease-in-out infinite 1.2s; }
      .glow-a { animation: glow-a 1.8s ease-in-out infinite; }
      .glow-b { animation: glow-b 1.8s ease-in-out infinite 0.6s; }
      .glow-c { animation: glow-c 1.8s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- outer hex — R=54, fills nearly full 120×120 canvas -->
  <polygon points="60,6 107,33 107,87 60,114 13,87 13,33"
           fill="none" stroke="#00ff88" stroke-width="3"/>

  <!-- inner hex — R=28 -->
  <polygon points="60,32 84,46 84,74 60,88 36,74 36,46"
           fill="none" stroke="#1a3a1a" stroke-width="1.5"/>

  <!-- lines: center → cyan nodes -->
  <line x1="60" y1="60" x2="60"  y2="10"  stroke="#00e5ff" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="60" x2="103" y2="37"  stroke="#00e5ff" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="60" x2="17"  y2="83"  stroke="#00e5ff" stroke-width="1.2" opacity="0.5"/>

  <!-- lines: center → dim nodes -->
  <line x1="60" y1="60" x2="103" y2="83"  stroke="#1e3a1e" stroke-width="1.2" opacity="0.8"/>
  <line x1="60" y1="60" x2="60"  y2="110" stroke="#1e3a1e" stroke-width="1.2" opacity="0.8"/>
  <line x1="60" y1="60" x2="17"  y2="37"  stroke="#1e3a1e" stroke-width="1.2" opacity="0.8"/>

  <!-- center node — donut so it works on any background -->
  <circle cx="60" cy="60" r="11" fill="none" stroke="#00ff88" stroke-width="5"/>
  <circle cx="60" cy="60" r="4"  fill="#00ff88"/>

  <!-- dim static nodes -->
  <circle cx="107" cy="83" r="5" fill="#007a3d"/>
  <circle cx="60"  cy="110" r="5" fill="#007a3d"/>
  <circle cx="17"  cy="37" r="5" fill="#007a3d"/>

  <!-- glow halos for pulsing nodes -->
  <circle cx="60"  cy="10" class="glow-a" fill="#00e5ff"/>
  <circle cx="103" cy="37" class="glow-b" fill="#00e5ff"/>
  <circle cx="17"  cy="83" class="glow-c" fill="#00e5ff"/>

  <!-- pulsing cyan nodes -->
  <circle cx="60"  cy="10" class="dot-a" fill="#00e5ff"/>
  <circle cx="103" cy="37" class="dot-b" fill="#00e5ff"/>
  <circle cx="17"  cy="83" class="dot-c" fill="#00e5ff"/>
</svg>
