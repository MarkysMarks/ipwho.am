<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <style>
      @keyframes pulse-a {
        0%,100% { r: 4; opacity: 1; }
        50%      { r: 7; opacity: 0.5; }
      }
      @keyframes pulse-b {
        0%,100% { r: 4; opacity: 1; }
        50%      { r: 7; opacity: 0.5; }
      }
      @keyframes pulse-c {
        0%,100% { r: 4; opacity: 1; }
        50%      { r: 7; opacity: 0.5; }
      }
      @keyframes glow-a {
        0%,100% { r: 4; opacity: 0; }
        50%      { r: 14; opacity: 0.2; }
      }
      @keyframes glow-b {
        0%,100% { r: 4; opacity: 0; }
        50%      { r: 14; opacity: 0.2; }
      }
      @keyframes glow-c {
        0%,100% { r: 4; opacity: 0; }
        50%      { r: 14; opacity: 0.2; }
      }
      .dot-a  { animation: pulse-a 1.8s ease-in-out infinite; }
      .dot-b  { animation: pulse-b 1.8s ease-in-out infinite 0.6s; }
      .dot-c  { animation: pulse-c 1.8s ease-in-out infinite 1.2s; }
      .glow-a { animation: glow-a 1.8s ease-in-out infinite; }
      .glow-b { animation: glow-b 1.8s ease-in-out infinite 0.6s; }
      .glow-c { animation: glow-c 1.8s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- background -->
  <rect width="120" height="120" rx="16" fill="#060c06"/>

  <!-- outer hex -->
  <polygon points="60,14 98,36 98,80 60,102 22,80 22,36"
           fill="none" stroke="#00ff88" stroke-width="2.5"/>

  <!-- inner hex -->
  <polygon points="60,30 82,42 82,68 60,80 38,68 38,42"
           fill="none" stroke="#1a3a1a" stroke-width="1"/>

  <!-- lines: center → cyan nodes -->
  <line x1="60" y1="58" x2="60" y2="28"  stroke="#00e5ff" stroke-width="1" opacity="0.45"/>
  <line x1="60" y1="58" x2="88" y2="46"  stroke="#00e5ff" stroke-width="1" opacity="0.45"/>
  <line x1="60" y1="58" x2="32" y2="70"  stroke="#00e5ff" stroke-width="1" opacity="0.45"/>

  <!-- lines: center → dim nodes -->
  <line x1="60" y1="58" x2="88" y2="70"  stroke="#1a3a1a" stroke-width="1" opacity="0.7"/>
  <line x1="60" y1="58" x2="60" y2="86"  stroke="#1a3a1a" stroke-width="1" opacity="0.7"/>
  <line x1="60" y1="58" x2="32" y2="46"  stroke="#1a3a1a" stroke-width="1" opacity="0.7"/>

  <!-- center node -->
  <circle cx="60" cy="58" r="8" fill="#00ff88"/>
  <circle cx="60" cy="58" r="3" fill="#060c06"/>

  <!-- dim static nodes -->
  <circle cx="92" cy="74" r="4" fill="#007a3d"/>
  <circle cx="60" cy="90" r="4" fill="#007a3d"/>
  <circle cx="28" cy="42" r="4" fill="#007a3d"/>

  <!-- glow halos for pulsing nodes -->
  <circle cx="60" cy="24" class="glow-a" fill="#00e5ff"/>
  <circle cx="92" cy="42" class="glow-b" fill="#00e5ff"/>
  <circle cx="28" cy="74" class="glow-c" fill="#00e5ff"/>

  <!-- pulsing cyan nodes -->
  <circle cx="60" cy="24" class="dot-a" fill="#00e5ff"/>
  <circle cx="92" cy="42" class="dot-b" fill="#00e5ff"/>
  <circle cx="28" cy="74" class="dot-c" fill="#00e5ff"/>
</svg>
